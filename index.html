  <header>
    <h1>Global Architectural Wonders</h1>
    <p>Exploring landmark engineering and structural designs across five continents.</p>
  </header>

  <main id="main-content">
    <figure>
      <img src="https://images.unsplash.com/photo-1543783207-ec64e4d95325?auto=format&fit=crop&w=800&q=80" 
           alt="The Roman aqueduct of Segovia with towering granite stone arches under a bright blue sky">
      <figcaption>
        <p>The Aqueduct of Segovia stands as an enduring monument to Roman engineering, carrying water across Spain using mortarless granite blocks that have survived two millennia.</p>
      </figcaption>
    </figure>

    <figure>
      <img src="https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?auto=format&fit=crop&w=800&q=80" 
           alt="The clock tower of the Palace of Westminster and Big Ben illuminated along the River Thames at twilight">
      <figcaption>
        <p>The Palace of Westminster showcases gothic revival architecture along the Thames, highlighted by the intricate detailing of the Elizabeth Tower clock faces.</p>
      </figcaption>
    </figure>

    <figure>
      <img src="https://images.unsplash.com/photo-1502602898657-3e91760cbb34?auto=format&fit=crop&w=800&q=80" 
           alt="The Eiffel Tower rising above autumnal trees in Paris on an overcast afternoon">
      <figcaption>
        <p>Constructed as the centerpiece of the 1889 World's Fair, the Eiffel Tower redefined structural ironwork, reaching 330 meters into the Parisian skyline.</p>
      </figcaption>
    </figure>

    <figure>
      <img src="https://images.unsplash.com/photo-1564507592333-c60657eea523?auto=format&fit=crop&w=800&q=80" 
           alt="The white marble dome and minarets of the Taj Mahal reflected in the central garden pool">
      <figcaption>
        <p>The Taj Mahal combines Persian, Islamic, and Indian architectural styles, constructed out of polished white Makrana marble that shifts in tone throughout the day.</p>
      </figcaption>
    </figure>
